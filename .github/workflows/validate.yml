name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repo structure
        run: ./scripts/validate-repo.sh
      - name: Check no personal path leaks
        run: |
          if grep -r '/Users/puma' --include='*.md' --include='*.sh' --include='*.mdc' . ; then
            echo "Personal path leak detected"
            exit 1
          fi
